
<!DOCTYPE html>
<html>
<head>
    <title>Space Shooter Game</title>
    <style>
        body {
            margin: 0;
            background: #080d24;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #00e5ff;
        }

        canvas {
            background: #101a3a;
            border: 3px solid #00e5ff;
            display: block;
            margin: 15px auto;
        }

        button {
            padding: 12px 25px;
            background: #00e5ff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        p {
            font-size: 15px;
        }
    </style>
</head>

<body>

    <h1>🚀 SPACE SHOOTER</h1>

    <p>Score: <span id="score">0</span>
       | Lives: <span id="lives">3</span></p>

    <canvas id="game" width="400" height="550"></canvas>

    <p>Use LEFT and RIGHT arrow keys to move.</p>
    <p>Press SPACE to shoot.</p>

    <button onclick="restartGame()">Restart Game</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, bullets, enemies, score, lives;
let gameOver = false;
let keys = {};
let enemyTimer = 0;
let stars = [];

function restartGame() {
    player = { x: 180, y: 480, width: 40, height: 40 };
    bullets = [];
    enemies = [];
    score = 0;
    lives = 3;
    gameOver = false;
    enemyTimer = 0;
    stars = [];

    for (let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * 400,
            y: Math.random() * 550,
            speed: 1 + Math.random() * 2
        });
    }

    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;

    requestAnimationFrame(update);
}

document.addEventListener("keydown", function(e) {
    keys[e.code] = true;

    if (e.code === "Space") {
        e.preventDefault();
        if (!gameOver) shoot();
    }
});

document.addEventListener("keyup", function(e) {
    keys[e.code] = false;
});

function shoot() {
    if (bullets.length < 5) {
        bullets.push({
            x: player.x + 18,
            y: player.y,
            width: 5,
            height: 15
        });
    }
}

function createEnemy() {
    enemies.push({
        x: Math.random() * 360,
        y: -40,
        width: 40,
        height: 40,
        speed: 2 + Math.random() * 2
    });
}

function drawPlayer() {
    ctx.font = "35px Arial";
    ctx.fillText("🚀", player.x, player.y + 35);
}

function drawEnemies() {
    ctx.font = "32px Arial";

    enemies.forEach(enemy => {
        ctx.fillText("👾", enemy.x, enemy.y + 32);
    });
}

function drawBullets() {
    ctx.fillStyle = "#00ffff";

    bullets.forEach(bullet => {
        ctx.fillRect(
            bullet.x,
            bullet.y,
            bullet.width,
            bullet.height
        );
    });
}

function collision(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

function update() {
    if (gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";

    stars.forEach(star => {
        star.y += star.speed;

        if (star.y > 550) {
            star.y = 0;
            star.x = Math.random() * 400;
        }

        ctx.fillRect(star.x, star.y, 2, 2);
    });

    if (keys["ArrowLeft"] && player.x > 0) {
        player.x -= 5;
    }

    if (keys["ArrowRight"] && player.x < 360) {
        player.x += 5;
    }

    drawPlayer();

    enemyTimer++;

    if (enemyTimer > 55) {
        createEnemy();
        enemyTimer = 0;
    }

    bullets.forEach(bullet => {
        bullet.y -= 7;
    });

    bullets = bullets.filter(bullet => bullet.y > 0);

    enemies.forEach(enemy => {
        enemy.y += enemy.speed;
    });

    bullets.forEach((bullet, bi) => {
        enemies.forEach((enemy, ei) => {
            if (collision(bullet, enemy)) {
                bullets.splice(bi, 1);
                enemies.splice(ei, 1);
                score += 10;

                document.getElementById("score").textContent = score;
            }
        });
    });

    enemies.forEach((enemy, index) => {
        if (enemy.y > 550) {
            enemies.splice(index, 1);
            lives--;
            document.getElementById("lives").textContent = lives;
        }
    });

    enemies.forEach((enemy, index) => {
        if (collision(player, enemy)) {
            enemies.splice(index, 1);
            lives--;
            document.getElementById("lives").textContent = lives;
        }
    });

    drawBullets();
    drawEnemies();

    if (lives <= 0) {
        gameOver = true;

        ctx.fillStyle = "red";
        ctx.font = "35px Arial";
        ctx.fillText("GAME OVER", 95, 260);

        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Final Score: " + score, 130, 300);
        return;
    }

    requestAnimationFrame(update);
}

restartGame();

</script>

</body>
</html>
